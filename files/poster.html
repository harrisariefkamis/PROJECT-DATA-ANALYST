<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Poster kurikulum dan perjalanan belajar Data Analyst.">
  <title>Poster Data Analyst</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f3f4f6;
      color: #172033;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main {
      width: min(100%, 980px);
      text-align: center;
    }
    h1 { margin: 0 0 16px; }
    img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 12px 32px rgb(0 0 0 / 14%);
    }
  </style>
</head>
<body>
  <main>
    <h1>Poster Data Analyst</h1>
    <img
      src="poster-design-data-analyst.jpg"
      alt="Poster kurikulum belajar Data Analyst"
    >
  </main>
</body>
</html>
