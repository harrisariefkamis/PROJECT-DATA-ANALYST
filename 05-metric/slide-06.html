<!DOCTYPE html>
<html>
<head>
<style>
html, body { margin: 0; padding: 0; }
body {
  width: 720pt; height: 405pt;
  box-sizing: border-box;
  padding: 40pt 40pt 48pt 40pt;
  display: flex; flex-direction: column;
  overflow: hidden;
  background: #1C2833; font-family: Arial, sans-serif;
  color: #FFFFFF;
}
.header { border-bottom: 2pt solid #5EA8A7; padding-bottom: 10pt; margin-bottom: 30pt; }
h1 { font-size: 28pt; margin: 0; color: #5EA8A7; }
.steps { display: flex; flex-direction: column; gap: 15pt; }
.step { display: flex; align-items: center; gap: 20pt; }
.number { width: 30pt; height: 30pt; background: #277884; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 16pt; flex-shrink: 0; }
.text { font-size: 16pt; }
</style>
</head>
<body>
<div class="header"><h1>Next Steps</h1></div>
<div class="steps">
  <div class="step"><div class="number"><p>1</p></div><div class="text"><p>Implementasi monitoring <b>D7 Retention</b> sebagai North Star Metric.</p></div></div>
  <div class="step"><div class="number"><p>2</p></div><div class="text"><p>Monitor lubang aktivasi menggunakan <i>conversion_rate.sql</i>.</p></div></div>
  <div class="step"><div class="number"><p>3</p></div><div class="text"><p>Optimalkan program referral untuk akuisisi berkualitas tinggi.</p></div></div>
</div>
<p style="margin-top: 40pt; text-align: center; color: #5EA8A7; font-weight: bold; font-size: 18pt;">Mari kita bangun produk yang lebih sehat!</p>
</body>
</html>
