<!DOCTYPE html>
<html>
<head>
<style>
html, body { margin: 0; padding: 0; }
body {
  width: 720pt; height: 405pt;
  box-sizing: border-box;
  padding: 40pt 40pt 48pt 40pt;
  display: flex; flex-direction: column;
  overflow: hidden;
  background: #FFFFFF; font-family: Arial, sans-serif;
  color: #1C2833;
}
.header { border-bottom: 2pt solid #277884; padding-bottom: 10pt; margin-bottom: 20pt; }
h1 { font-size: 28pt; margin: 0; color: #277884; }
.content { display: flex; flex-direction: column; flex: 1; }
.placeholder-box { flex: 1; background: #F3F4F6; border: 1pt dashed #CBD5E1; border-radius: 8pt; display: flex; align-items: center; justify-content: center; margin-bottom: 15pt; }
.placeholder-box p { color: #94A3B8; font-size: 12pt; }
.strategy { padding: 10pt 20pt; background: #E6F3F4; border-radius: 8pt; border-left: 5pt solid #277884; }
.strategy p { margin: 0; font-size: 13pt; line-height: 1.4; }
</style>
</head>
<body>
<div class="header"><h1>Channel Optimization</h1></div>
<div class="content">
  <div id="channel-table" class="placeholder placeholder-box">
    <p>[Channel Performance Table]</p>
  </div>
  <div class="strategy">
    <p><b>Strategi:</b> Pindahkan budget dari <i>Paid</i> ke <i>Referral Programs</i> atau <i>Organic SEO</i>. CAC per retained user di Paid saat ini tidak berkelanjutan secara unit ekonomi.</p>
  </div>
</div>
</body>
</html>
