name: Notebook tests

on:
  push:
    paths:
      - '06-data-cleaning/notebooks/**.ipynb'
  pull_request:
    paths:
      - '06-data-cleaning/notebooks/**.ipynb'

jobs:
  notebooks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.11

    - name: Install deps
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install nbformat nbconvert pytest-nbval pytest

    - name: Run nbval tests
      run: |
        pytest --nbval-lax 06-data-cleaning/notebooks/*.ipynb -q
