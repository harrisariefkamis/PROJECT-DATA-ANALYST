version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Jakarta"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
    groups:
      actions:
        patterns:
          - "*"
