name: Validate Colab Notebooks

on:
  push:
    branches: [ main ]
    paths:
      - 'notebooks/**.ipynb'
  pull_request:
    branches: [ main ]
    paths:
      - 'notebooks/**.ipynb'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nbformat nbqa flake8

      - name: Detect notebooks
        id: detect
        run: |
          if ls notebooks/*.ipynb 1> /dev/null 2>&1; then
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "ℹ️ Tidak ada notebook, skip."
          fi

      - name: Validate JSON & Colab Metadata
        if: steps.detect.outputs.found == 'true'
        run: |
          python << 'PYEOF'
          import sys, glob, nbformat

          files = sorted(glob.glob('notebooks/*.ipynb'))
          failed = 0
          for f in files:
              try:
                  nb = nbformat.read(f, as_version=4)
                  nbformat.validate(nb)
                  # Cek metadata khusus Colab (opsional)
                  colab_meta = nb.metadata.get('colab', {})
                  if colab_meta:
                      print(f'ℹ️ {f}: metadata Colab ditemukan (provenance: {colab_meta.get("provenance", "unknown")})')
                  print(f'✅ {f} struktur valid ({len(nb.cells)} cells)')
              except Exception as e:
                  print(f'❌ {f}: {e}')
                  failed = 1
          sys.exit(1 if failed else 0)
          PYEOF

      - name: Lint notebook code with nbqa
        if: steps.detect.outputs.found == 'true'
        run: |
          nbqa flake8 notebooks/ \
            --max-line-length=120 \
            --extend-ignore=E203,W503,E402,E501,W291,W293 \
            --exclude=.git,__pycache__,.ipynb_checkpoints \
            --statistics

      - name: Check for sensitive outputs (warning)
        if: steps.detect.outputs.found == 'true'
        run: |
          if grep -r -i -E "api_key|password|secret|token" notebooks/*.ipynb; then
            echo "::warning::Kemungkinan data sensitif ditemukan di output notebook."
          fi
