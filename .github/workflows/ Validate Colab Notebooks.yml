name: Validate Colab Notebooks

on:
  push:
    branches: [ main ]
    paths:
      - 'notebooks/**.ipynb'
  pull_request:
    branches: [ main ]
    paths:
      - 'notebooks/**.ipynb'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # ✅ Di-pin ke full SHA
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # ✅ Di-pin ke full SHA
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nbformat nbqa flake8

      # ... step lainnya tetap sama ...
